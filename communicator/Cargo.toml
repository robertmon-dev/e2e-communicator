[package]
name = "communicator"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.25"
dotenvy = "0.15.7"

tonic = "0.14.6"
prost = "0.14.4"

sea-orm = { version = "2.0.0-rc", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
sea-orm-migration = "2.0.0-rc"
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tokio = { version = "1.0", features = ["full"] }
orion = "0.17.15"

uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = "0.4.45"
thiserror = "2.0.18"
serde_repr = "0.1.20"
bitflags = "2.13.0"
url_serde = "0.2.0"
url = { version = "2.5.8", features = ["serde"] }
zeroize = "1.9.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }



[build-dependencies]
tonic-build = "0.14.6"
