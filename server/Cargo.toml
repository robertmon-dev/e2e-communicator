[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }

tonic = "0.14.6"
prost = "0.14.4"

tokio = { version = "1.0", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redis = { version = "1.5.0", features = ["tokio-comp", "sentinel", "streams"] }
tokio-stream = "0.1.19"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = "0.4.45"
config = "0.15.25"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
